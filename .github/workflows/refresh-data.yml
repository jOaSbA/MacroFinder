name: Refresh app data

# Twice a day. Bonus weeks don't line up across chains, so a weekly run would
# miss one chain's rollover by days. Anything more often leans harder on the
# politeness budget in CLAUDE.md section 1 than the data is worth.
#
# Nothing is committed. latest.json goes to the `data-latest` release next to
# the catalogue, and so does the dev database, gzipped. Carrying the database
# from run to run is what lets price history build up at all: before this,
# every run started from an empty database and "cheapest in N weeks" could
# never be more than zero.
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# build-db.yml reads and writes the same release.
concurrency:
  group: data-release
  cancel-in-progress: false

env:
  RELEASE_TAG: data-latest

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      # A missing asset is the first-run case. A corrupt one is treated the
      # same way: start clean rather than fail the whole refresh.
      - name: Restore price history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download "$RELEASE_TAG" --pattern 'history.sqlite3.gz' --dir /tmp; then
            gunzip -c /tmp/history.sqlite3.gz > data/bonusrank.sqlite3 \
              && sqlite3 data/bonusrank.sqlite3 "pragma integrity_check" | grep -qx ok \
              || { echo "history unreadable, starting clean"; rm -f data/bonusrank.sqlite3; }
          else
            echo "no history yet, starting clean"
          fi
          [ -f data/bonusrank.sqlite3 ] && \
            sqlite3 data/bonusrank.sqlite3 "select count(*) || ' observations over ' || count(distinct observed_at) || ' days' from price_observations" || true

      - name: Seed reference data
        run: bonusrank seed

      # One chain failing must not take the other two down.
      - name: Ingest AH
        run: bonusrank ingest --chain ah || echo "AH ingest failed, continuing"

      - name: Ingest Jumbo
        run: bonusrank ingest --chain jumbo || echo "Jumbo ingest failed, continuing"

      - name: Ingest Aldi
        run: bonusrank ingest --chain aldi || echo "Aldi ingest failed, continuing"

      # Label macros from AH's product pages. 300 requests is about 2.5
      # minutes; macro_candidates spends them on products that are on offer
      # right now first. Jumbo and Aldi don't publish nutrition we can read.
      - name: Fetch label macros (AH)
        run: bonusrank ingest --chain ah --with-macros 300 || echo "AH macro fetch failed, continuing"

      # Aldi has no searchable catalogue, so only AH and Jumbo get shelf prices.
      - name: Refresh base prices (AH)
        run: bonusrank prices --refresh --all --chain ah || echo "AH price refresh failed, continuing"

      - name: Refresh base prices (Jumbo)
        run: bonusrank prices --refresh --all --chain jumbo || echo "Jumbo price refresh failed, continuing"

      - name: Export snapshot for the app
        run: |
          mkdir -p dist
          bonusrank export --out dist/latest.json
          gzip -9 -c data/bonusrank.sqlite3 > dist/history.sqlite3.gz
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "App data" \
              --notes "Rolling data for the app. Assets are replaced in place. Not a source release." \
              --latest=false
          gh release upload "$RELEASE_TAG" dist/latest.json dist/history.sqlite3.gz --clobber
