name: CI

on:
  push:
    # This repo's default branch is master, not main. Both are listed so a
    # future rename doesn't silently stop CI from running again - which is
    # exactly what happened here: the first two commits landed on master
    # against a main-only trigger and no workflow ever fired.
    branches: [master, main]
  pull_request:

jobs:
  python-tests:
    name: Python tests (bonusrank)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  android-tests:
    name: Android unit tests (MacroFinder app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # No Android emulator here on purpose - only the plain JVM unit tests
      # under app/src/test RUN in CI. See android/README.md for the split
      # between those and the instrumented tests under app/src/androidTest,
      # which need a device (milestone 29).
      - name: Run unit tests
        run: gradle testDebugUnitTest

      # The instrumented tests cannot RUN here, but they can still be compiled,
      # which is most of what stops them rotting: a rename or a signature
      # change in the code they exercise fails this step rather than being
      # found weeks later by whoever next boots an emulator.
      - name: Compile the instrumented tests
        run: gradle assembleDebugAndroidTest

      # Built in the same job as the tests so the Gradle setup and cache are
      # paid for once. This is the only way to get a runnable app without
      # installing the whole Android toolchain locally.
      - name: Build debug APK
        run: gradle assembleDebug

      # DEBUG ONLY, and unsigned with the standard debug key. It is for
      # sideloading onto your own phone to look at - it cannot go to a store,
      # and it is not a release build. `isMinifyEnabled = false`, debuggable,
      # no signing config of its own.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: macrofinder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # Long enough to be useful, short enough not to hoard build output
          # for a repo that pushes often.
          retention-days: 14

  # Milestone 29: the Compose UI tests and the milestone 17 sync tests, on a
  # real emulator. Slower than the unit tests, so it runs as its own job.
  android-device-tests:
    name: Android device tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: gradle connectedDebugAndroidTest
