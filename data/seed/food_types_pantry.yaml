# Cupboard staples the substitution engine (brief section 4) needs to cost a
# recipe. They carry almost no protein, but a composition cannot be priced or
# described without them: "kwark + cacao" is not the recipe, "kwark + cacao +
# zoetstof" is.
#
# These never appear in a bonus folder and are bought once a year, so the
# compositions that use them declare a `pantry_price_eur_per_kg` instead of
# relying on an observed price. The price belongs to the recipe item, not to the
# food - see data/seed/archetypes.yaml.
#
# Protein is a real 0.0 here, not NULL: "this food has no protein" is a positive
# finding, and CLAUDE.md section 5 keeps the two distinct.

- key: zoetstof
  meal_kind: ingredient
  name_nl: zoetstof
  name_en: sweetener
  state: solid
  protein_per_100g: 0.0
  kcal_per_100g: 0          # sucralose/steviol tablets and drops
  shelf_life_days_unopened: 1095
  shelf_life_days_opened: 730
  freezable: false
  aliases: [zoetstof, stevia, sucralose, zoetjes, vloeibare zoetstof]

