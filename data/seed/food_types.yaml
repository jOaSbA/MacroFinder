# food_types seed - common Dutch staples, protein-first.
#
# EVERY row here is confidence: seed, source: manual. These are widely-published
# per-100g values for generic foods, NOT NEVO extractions. The brief wants NEVO
# (RIVM) as the authority with the NEVO code cited in source_ref - that dataset
# carries usage conditions you have to accept at rivm.nl yourself, so it is not
# committed here and these numbers are not dressed up as its output.
# Run `bonusrank seed --nevo <file>` once you have it to upgrade rows in place.
#
# Gaps are deliberate. A field left out stays NULL rather than being invented
# (brief section 4: leave gaps rather than guessing).
#
# Keyed on food type + variant, because the variant is where the protein is:
# magere vs volle kwark, tonijn in water vs in olie, linzen droog vs uit blik.

