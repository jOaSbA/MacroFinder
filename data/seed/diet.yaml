# Milestone 32. Every food type sits in exactly one list, so a new food type
# without a diet fails tests/test_diet_seed.py instead of silently counting
# as meat. When a product line varies (bread with or without milk, meat
# substitutes with or without egg), the food type goes in the stricter list.
# A product with no food type has no known diet and is hidden by the filter.

