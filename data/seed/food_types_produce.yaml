# food_types seed, expansion pass: produce, and the protein variants the first
# full ingest showed were missing.
#
# Same rules as food_types.yaml: source 'manual', confidence 'seed', gaps left
# as gaps. Loaded automatically - the loader globs data/seed/food_types*.yaml,
# so you can drop your own file in here without touching the code.
#
# Vegetables and fruit carry little protein, but they are what the kcal floor
# and the variety cap (brief section 5) get satisfied with, so the optimiser
# needs them present and priced rather than absent.

