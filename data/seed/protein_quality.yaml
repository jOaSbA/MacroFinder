# PLAN-V2 section 4.3: one word per protein source, so a cheap plant source
# topping the euro-per-protein list doesn't pass for the whole story.
#
#   complete    all essential amino acids in useful amounts
#   incomplete  low in at least one (lysine in grains, methionine in legumes)
#   blend       a mix; depends on the recipe
#
# Authored, not computed, and deliberately coarse. Not an amino-acid database.
# A food type not listed here has no flag and the app says nothing.

