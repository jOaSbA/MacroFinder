# Food types the meal customiser's templates need and the existing seed did not
# have (milestone 12). Same rules as every other food_types*.yaml: the loader
# globs them all, a duplicate key across files raises, and every row is
# source='manual' / confidence='seed' until a NEVO code replaces it.
#
# Figures are generic supermarket own-brand label values. Where a variant
# genuinely changes the protein, it gets its own key rather than an averaged
# one - the same reason kwark is split magere/halfvolle/volle.

# --- sauzen ---------------------------------------------------------------

- key: pesto_groen
  meal_kind: ingredient
  name_nl: groene pesto
  state: solid
  protein_per_100g: 4.5
  kcal_per_100g: 450
  carbs_per_100g: 4.5
  fat_per_100g: 45.0
  shelf_life_days_unopened: 365
  shelf_life_days_opened: 5
